<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pristina Smart Parking Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pristina Smart Parking</h1>
        <nav>
            <a href="#">Home</a>
        </nav>
    </header>
    <div id="parking-map">Map is loading...</div>
    <div id="alerts-container"></div>
    <div id="error-message" class="error-message" style="display: none;"></div>
    <footer>
        <div class="footer-content">
            <p>© 2025 Pristina Smart Parking. Powered by OpenStreetMap and Leaflet.</p>
            <form id="subscribe-form">
                <h3>Subscribe for Updates</h3>
                <!-- Sends POST to http://localhost:8085/api/subscribe with { email: string } -->
                <input type="email" id="subscribe-email" placeholder="Enter your email" required>
                <button type="submit">Subscribe</button>
            </form>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
